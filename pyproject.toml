[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-alpha-lab"
version = "0.1.0"
description = "PIT-safe monthly alpha research over governed NFF/P0/P1 outputs"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1.0", "numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
