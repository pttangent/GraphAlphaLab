name: Dual Theme CI

on:
  push:
    branches:
      - agent/dual-theme-alpha-reporting
  pull_request:
    branches:
      - main
      - master
      - agent/batch-alpha-reporting

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -m pytest -q --tb=short
