name: Dual Theme CI

on:
  push:
    branches:
      - agent/dual-theme-alpha-reporting
  pull_request:
    branches:
      - main
      - master
      - agent/batch-alpha-reporting

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pytest_summary: ${{ steps.pytest.outputs.pytest_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=line > pytest.log 2>&1
          status=$?
          summary=$(grep -E '^(FAILED|ERROR) ' pytest.log | head -n 1 | tr -cd '[:alnum:] _.,:=/\[\]-' | cut -c1-220)
          if [ -z "$summary" ]; then
            summary=$(tail -n 1 pytest.log | tr -cd '[:alnum:] _.,:=/-' | cut -c1-220)
          fi
          echo "pytest_summary=$summary" >> "$GITHUB_OUTPUT"
          cat pytest.log
          exit $status

  diagnostic:
    name: "pytest summary: ${{ needs.test.outputs.pytest_summary }}"
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.test.outputs.pytest_summary }}"
