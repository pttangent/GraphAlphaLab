name: Install governed GraphAlphaLab patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  install-and-test:
    if: github.head_ref == 'agent/batch-alpha-reporting' || github.ref_name == 'agent/batch-alpha-reporting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch-alpha-reporting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode governed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .gal_patch/chunk_* | base64 --decode > /tmp/gal_governed_patch.tar.gz
          echo 'cb2aa805040f4cbd9f7c6a4a59f000cdcb3dc07e119b8ff6dc995dad5b5e3224  /tmp/gal_governed_patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gal_governed_patch.tar.gz -C .
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e '.[test]'
      - name: Compile
        shell: bash
        run: python -m compileall -q src scripts
      - name: Test
        id: pytest
        continue-on-error: true
        shell: bash
        run: python -m pytest -q --tb=short > /tmp/pytest.log 2>&1
      - name: Upload pytest failure
        if: steps.pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure
          path: /tmp/pytest.log
          retention-days: 1
      - name: Fail on test error
        if: steps.pytest.outcome == 'failure'
        shell: bash
        run: |
          tail -n 120 /tmp/pytest.log
          exit 1
      - name: Publish atomic tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gal_patch
          rm -f .github/workflows/install_governed_gal_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: govern and stream graph alpha research'
          git push origin HEAD:agent/batch-alpha-reporting
