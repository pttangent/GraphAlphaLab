name: Install bounded P1 purity spill

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  install-and-test:
    if: github.head_ref == 'agent/batch-alpha-reporting' || github.ref_name == 'agent/batch-alpha-reporting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch-alpha-reporting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode bounded P1 reporter
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .gal_p1_spill/payload.b64 > /tmp/gal_p1_spill.tar.gz
          echo '6819a256780190c2db8af04716a52c9fc7a093883c97cd68d1aa8fe04a6c2c2d  /tmp/gal_p1_spill.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gal_p1_spill.tar.gz -C .
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e '.[test]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -m pytest -q --tb=short
      - name: Publish tested bounded reporter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gal_p1_spill
          rm -f .github/workflows/install_p1_purity_spill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound 33-session P1 purity memory'
          git push origin HEAD:agent/batch-alpha-reporting
