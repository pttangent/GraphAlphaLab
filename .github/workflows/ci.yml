name: CI

on:
  push:
    branches: [main, agent/monthly-alpha-research]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m py_compile scripts/run_monthly_alpha_research.py src/graph_alpha_lab/*.py
      - run: python -m pytest -q
      - run: python scripts/run_monthly_alpha_research.py --help
